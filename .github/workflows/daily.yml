name: Daily Telegram Posts

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30
    - cron: "30 22 * * *"   # 04:00 AM IST  -> "Good Morning warrior" + quote
    - cron: "0 7 * * *"     # 12:30 PM IST  -> proverb / idiom
    - cron: "30 15 * * *"   # 09:00 PM IST  -> bedtime story + closing message
  workflow_dispatch:
    inputs:
      mode:
        description: "quote, proverb or story (for manual testing)"
        required: true
        default: "quote"

permissions:
  actions: write   # lets the job re-enable itself (prevents 60-day auto-disable)
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "30 22 * * *" ]; then
            MODE="quote"
          elif [ "$SCHEDULE" = "0 7 * * *" ]; then
            MODE="proverb"
          else
            MODE="story"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 send.py "${{ steps.mode.outputs.mode }}"

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" || true
