name: Daily Telegram Posts

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30
    - cron: "33 22 * * *"   # ~04:03 AM IST -> "Good Morning warrior" + quote
    - cron: "10 12 * * *"   # ~05:40 PM IST -> proverb / idiom
    - cron: "33 15 * * *"   # ~09:03 PM IST -> bedtime story + closing message
  workflow_dispatch:
    inputs:
      mode:
        description: "quote, proverb or story (for manual testing)"
        required: true
        default: "quote"

permissions:
  actions: write   # lets the job re-enable itself (prevents 60-day auto-disable)
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            # Determine mode based on actual UTC time (robust against GitHub's scheduling delays)
            HOUR_MIN=$(date -u +%H%M)
            echo "Current UTC time: $HOUR_MIN"

            if [ "$HOUR_MIN" -ge 2200 ] || [ "$HOUR_MIN" -lt 100 ]; then
              MODE="quote"
            elif [ "$HOUR_MIN" -ge 1200 ] && [ "$HOUR_MIN" -lt 1400 ]; then
              MODE="proverb"
            elif [ "$HOUR_MIN" -ge 1500 ] && [ "$HOUR_MIN" -lt 1700 ]; then
              MODE="story"
            else
              # Fallback: pick closest scheduled slot
              MODE="quote"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 send.py "${{ steps.mode.outputs.mode }}"

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" || true
